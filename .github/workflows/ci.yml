name: CI

on:
  push:
    branches:
      - feat/product-gallery-markdown-reference
  pull_request:
    branches:
      - feat/product-gallery-markdown-reference
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Build
        run: bun run build
